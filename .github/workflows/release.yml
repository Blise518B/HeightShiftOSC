# Builds and publishes every release on GitHub's machines — nothing is
# built locally.
#
# release.bat starts it on main ("gh workflow run release.yml -f
# release=true"). The workflow
#   1. works out the version: 2.0.<commits on main> (version.py's rule),
#   2. runs the tests on Windows and on Linux,
#   3. builds HeightShift.exe (PyInstaller one-file, Windows) and
#      HeightShift-Linux-x86_64.AppImage (+ .zsync, tools/build_linux.sh),
#      each with that version baked in,
#   4. and only when all of that worked, creates the release v<version>
#      with both files and the VRChat menu package, notes from CHANGELOG.md's
#      "## [<version>]" section, as the latest release.
# A failed test or build means no release at all, so nobody is offered one
# without its files. The file names never change: releases/latest/download/
# <name> always resolves and the in-app updater (updater.pick_exe_asset)
# finds its platform's file.
#
# Run by hand without "release" (Actions → Release builds → Run workflow) it
# only tests and builds; the files stay as workflow artifacts.
name: Release builds

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (else: test and build only)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          base=$(sed -n 's/^BASE_VERSION = "\(.*\)"/\1/p' version.py)
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version ($(git rev-parse --short HEAD))"
          if [ "${{ inputs.release }}" = "true" ] && git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::v$version is released already — commit something new first"; exit 1
          fi

  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt's libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install -r requirements.txt pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider

  windows:
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build number counts commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python tools/bake_version.py v${{ needs.version.outputs.version }}
      - name: PyInstaller (one file, the same as build.bat)
        run: >-
          python -m PyInstaller --noconfirm --onefile --windowed
          --icon OSC_Scale.ico --add-data "OSC_Scale.ico;." --add-data "fonts;fonts"
          --add-data "assets;assets" --name HeightShift main.py
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/HeightShift.exe
          retention-days: 30

  linux:
    needs: [version, test]
    # The oldest Ubuntu GitHub offers: the AppImage needs a glibc at least as
    # new as the one it was built against, so an older base runs on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System packages (what PyInstaller bundles for Qt's X11 / Wayland)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends file \
            libegl1 libgl1 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-cursor0 libwayland-egl1
      - run: bash tools/build_linux.sh v${{ needs.version.outputs.version }}
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            dist/HeightShift-Linux-x86_64.AppImage
            dist/HeightShift-Linux-x86_64.AppImage.zsync
          retention-days: 30

  release:
    # Only now, with both builds done, does the release exist at all.
    needs: [version, windows, linux]
    if: inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else "See CHANGELOG.md."
          body += ("\n\n### Download\n"
                   "- **HeightShift.exe** — Windows, one file, no install.\n"
                   "- **HeightShift-Linux-x86_64.AppImage** — Linux: make it executable and run it.\n"
                   "- **HeightShift-VRCFury.unitypackage** — the in-VRChat menu "
                   "([setup](https://github.com/Blise518B/HeightShiftOSC/blob/main/docs/VRCHAT_MENU.md)).\n\n"
                   "A copy from 2.0.20 on offers this update itself.")
          open("notes.md", "w", encoding="utf-8").write(body)
          print(body)
          EOF
      - name: Publish v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "HeightShift $VERSION" \
            --notes-file notes.md --latest \
            files/HeightShift.exe files/HeightShift-Linux-x86_64.AppImage \
            files/HeightShift-Linux-x86_64.AppImage.zsync \
            docs/unity/HeightShift-VRCFury.unitypackage
